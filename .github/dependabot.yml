# Keeps GitHub Actions, npm, Python and Docker dependencies up to date with monthly, grouped PRs.
# Commit prefixes produce Conventional Commit PR titles such as "build(deps): bump ...".
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      web:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      server:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: pip
    directory: /ingest
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope

  # The digest of the base images in the Dockerfiles
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
