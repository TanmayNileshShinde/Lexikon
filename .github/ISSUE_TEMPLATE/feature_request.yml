name: Feature request
description: Suggest an idea for Lexikon.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or the use case, rather than the solution.
      placeholder: "When I read a text I want to paste a whole sentence and see the base form of every word..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could Lexikon help?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
