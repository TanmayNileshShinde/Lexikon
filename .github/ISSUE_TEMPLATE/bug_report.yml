name: Bug report
description: Something does not work (the page breaks, the API errors, audio does not play...).
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the error message, if there is one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the site
        2. Search for "Doppelgänger"
        3. Press the speaker button
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: url
    attributes:
      label: Page or URL
      description: The address where it happens, for example `/entry/3004/Doppelgänger` or `/?q=haus`.
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Computer
        - Phone
        - Tablet
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: "Firefox 140 on Windows 11"
  - type: textarea
    id: logs
    attributes:
      label: Console output or screenshot
      description: Anything shown in the browser console (F12), or drag a screenshot here.
